<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Picadito App: pegá la lista del grupo y armá equipos de fútbol parejos.">
  <meta name="theme-color" content="#0b1e3f">
  <title>Picadito App</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png?v=2">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/base.css?v=3">
  <link rel="stylesheet" href="css/components.css?v=3">
  <link rel="stylesheet" href="css/home.css?v=3">
  <link rel="stylesheet" href="css/screens.css?v=6">
  <link rel="stylesheet" href="css/effects.css?v=3">

<body>
<div class="tv">
  <div class="topbar">
    <button class="navbtn" id="backBtn" data-act="back" title="Volver atrás" aria-label="Volver atrás" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg><span>Atrás</span>
    </button>
    <div class="tag"><b id="tag">MENÚ</b></div>
    <div class="ttl" id="title">Picadito App</div>
    <button class="snd" id="sndBtn" title="Sonido" aria-label="Sonido"></button><div class="count"><b id="count">&nbsp;</b></div>
    <button class="homebtn" id="homeBtn" data-act="home" title="Menú principal" aria-label="Menú principal">
      <img src="assets/img/logo.svg" alt="" width="28" height="31">
      <span class="lbl">Menú <br>principal</span>
    </button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="cmdbar" id="cmdbar"></div>
</div>

<script type="module" src="js/main.js"></script>
