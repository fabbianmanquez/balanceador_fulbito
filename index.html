<!DOCTYPE html>
<!--
  ============================================================
  SONIDO DE LOS BOTONES
    La app trae sonidos sintetizados, sin archivos. Si preferis usar
    archivos propios, crea la carpeta y pone tres wav (o mp3/ogg):
      assets/sfx/move.wav      navegar por listas y flechas
      assets/sfx/confirm.wav   confirmar y avanzar
      assets/sfx/back.wav      volver y nueva lista
    Se detectan solos. Si falta alguno, ese caso sigue sonando
    sintetizado. Para cambiar nombres o formato, edita SOUND_FILES
    en el script. OJO: la carga por fetch no funciona abriendo el
    archivo con doble click (file://); necesitas un servidor local
    o GitHub Pages.

  ============================================================
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armador de equipos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --nav1:#3f78c4; --nav2:#1d3f7d; --nav3:#0b1e3f;
    --red1:#c0524a; --red2:#7d2b25;
    --steel-hi:#eef1f5; --steel-mid:#c2cad4; --steel-lo:#98a3b1;
    --chrome1:#f6f8fa; --chrome2:#c9d1da; --chrome3:#8d99a8;
    --dark1:#3b4655; --dark2:#0e141d;
    --ink:#101820; --ink-soft:#41505f;
    --gold1:#ffe870; --gold2:#dfae15; --goldbd:#8a6a06;
    --a1:#d9342b; --a2:#e8842a; --a3:#4caf2f; --a4:#a8dc2e; --a5:#f2c227;
    --font:'Chakra Petch','Arial Narrow',Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);
    background:radial-gradient(ellipse at 50% -10%,#4a80c9 0%,#224d92 35%,#0b1e3f 100%) fixed;
    color:var(--ink);min-height:100vh;padding:10px;-webkit-font-smoothing:antialiased;
  }
  .tv{
    width:100%;max-width:960px;margin:0 auto;border:3px solid #05101f;border-radius:3px;
    background:linear-gradient(180deg,#20365c,#0d1c33);
    box-shadow:0 0 0 1px #55708f,0 12px 34px rgba(0,0,0,.55);overflow:hidden;
  }

  /* ---- barra superior tipo "Result" ---- */
  .topbar{
    display:flex;align-items:stretch;
    background:linear-gradient(180deg,var(--chrome1) 0%,var(--chrome2) 46%,var(--chrome3) 54%,#e4e9ef 100%);
    border-bottom:2px solid #05101f;
  }
  .tag{
    background:linear-gradient(180deg,var(--nav1),var(--nav2));color:#fff;
    display:flex;align-items:center;padding:6px 18px;transform:skewX(-16deg);margin-left:-8px;
    border-right:2px solid #05101f;
  }
  .tag[hidden]{display:none}
  .tag b{transform:skewX(16deg);font-size:12px;font-style:italic;letter-spacing:.6px;text-shadow:1px 1px 0 #05101f}
  .ttl{
    flex:1;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:700;font-style:italic;letter-spacing:1.2px;color:#131c26;
    text-shadow:0 1px 0 rgba(255,255,255,.8);padding:6px 10px;text-align:center;
  }
  .count{
    background:linear-gradient(180deg,#4d5a6b,#141c26);color:#ffe870;display:flex;align-items:center;
    padding:6px 16px;transform:skewX(-16deg);margin-right:-8px;border-left:2px solid #05101f;
  }
  .count b{transform:skewX(16deg);font-size:12px;letter-spacing:.6px}

  .stage{padding:12px;display:grid;gap:10px;grid-template-columns:1fr 1fr}
  .stage.single{grid-template-columns:1fr;max-width:560px;margin:0 auto}
  @media (max-width:700px){ .stage{grid-template-columns:1fr} }

  /* ---- panel base ---- */
  .panel{
    background:linear-gradient(180deg,var(--steel-hi),var(--steel-mid) 58%,var(--steel-lo));
    border:2px solid #05101f;border-radius:2px;
    box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(0,0,0,.45);padding:5px;
  }
  .phead{
    background:linear-gradient(180deg,var(--dark1),var(--dark2));color:#fff;
    font-size:12px;font-weight:700;font-style:italic;letter-spacing:.8px;
    padding:4px 10px;text-align:center;margin-bottom:5px;border:1px solid #05101f;
    text-shadow:1px 1px 0 #000;
  }
  .phead.claro{background:linear-gradient(180deg,#fff,#c9d1da);color:#101820;text-shadow:none}
  .phead.oscuro{background:linear-gradient(180deg,#2b3138,#05080c)}

  /* ---- lista tipo editor PES ---- */
  .list{
    background:#132340;border:2px solid #05101f;padding:3px;
    display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow:auto;
  }
  .row{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
    background:linear-gradient(180deg,#e9edf2,#c3ccd8);
    border:1px solid #7d8898;border-radius:1px;padding:5px 8px;
    font-family:inherit;font-size:14px;font-weight:700;color:#12233d;
  }
  .row:hover{background:linear-gradient(180deg,#fbfcfd,#d6dde6)}
  .row.sel{background:linear-gradient(180deg,#fff,#eef1f5);border:2px solid #c0271d;
    box-shadow:0 0 0 1px #ffe870}
  .row.gk{background:linear-gradient(180deg,#3d86ff,#0a44d8);border:1px solid #03246b;color:#fff;
    text-shadow:0 1px 1px rgba(0,0,0,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  .row.empty{color:#7b8797;font-weight:400;font-style:normal}
  .row:focus-visible{outline:3px solid #ffe870;outline-offset:1px}
  .row.dup{background:linear-gradient(180deg,#fde7e4,#f2b9b2);border:2px solid #c0271d}
  .badge.rep{background:linear-gradient(180deg,var(--red1),var(--red2));border:1px solid #4d0f0b}
  .row input.nm-edit{flex:1;min-width:0;width:auto;font:inherit;padding:3px 7px;
    border:1px solid #c0271d;border-radius:2px;background:#fff;color:#12233d;box-shadow:none;cursor:text}
  .row .sug{font-family:inherit;font-size:12px;font-weight:700;font-style:italic;cursor:pointer;
    background:linear-gradient(180deg,var(--gold1),var(--gold2));color:#2a2100;border:1px solid var(--goldbd);
    border-radius:2px;padding:3px 8px;flex:0 0 auto;white-space:nowrap}
  .row .sug:hover{filter:brightness(1.08)}
  .row .del{background:linear-gradient(180deg,#d0554c,#8c241d);color:#fff;border:1px solid #4d0f0b;
    border-radius:2px;font-weight:900;width:22px;height:22px;cursor:pointer;flex:0 0 auto;line-height:1}

  .badge{
    background:linear-gradient(180deg,#4d5a6b,#141c26);color:#fff;font-size:10px;font-weight:700;
    letter-spacing:.6px;padding:2px 5px;border-radius:1px;min-width:34px;text-align:center;
    text-shadow:1px 1px 0 #000;flex:0 0 auto;
  }
  .badge.por{background:linear-gradient(180deg,var(--gold1),var(--gold2));color:#2a2100;text-shadow:none;border:1px solid var(--goldbd)}
  .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arw{display:block;flex:0 0 auto}

  /* ---- caja de dato (tipo Rating / Points) ---- */
  .sbox{border:2px solid #05101f;margin-bottom:5px;background:#fff}
  .sbox h4{margin:0;background:linear-gradient(180deg,var(--dark1),var(--dark2));color:#fff;
    font-size:11px;font-style:italic;letter-spacing:.8px;padding:3px 8px;text-align:center;text-shadow:1px 1px 0 #000}
  .sbox p{margin:0;background:linear-gradient(180deg,#fff,#cfd6de);text-align:center;
    font-size:19px;font-weight:700;padding:5px 4px;color:#101820}
  .sbox p.sm{font-size:14px;line-height:1.35;overflow-wrap:anywhere}

  /* ---- menu tipo "Exit match series" ---- */
  .menu{display:flex;flex-direction:column;gap:2px;padding:2px}
  .mbtn{
    position:relative;width:100%;font-family:inherit;font-size:16px;font-weight:700;font-style:italic;
    letter-spacing:.4px;padding:11px 34px;cursor:pointer;color:#101820;
    background:linear-gradient(180deg,#f2f5f8,#c6cdd7);border:1px solid #6b7686;
    display:flex;align-items:center;justify-content:center;gap:10px;line-height:1.25;
  }
  .mbtn:hover:not(:disabled),.mbtn.on{
    background:linear-gradient(180deg,var(--gold1),var(--gold2));border-color:var(--goldbd)}
  .mbtn.on::after{
    content:'';position:absolute;right:6px;border-style:solid;border-width:7px 9px 7px 0;
    border-color:transparent #c0271d transparent transparent}
  .mbtn:disabled{opacity:.4;cursor:not-allowed;background:linear-gradient(180deg,#dfe3e8,#b8bfc8)}
  .mbtn .lead{position:absolute;left:8px;display:flex;align-items:center}

  /* ---- formularios ---- */
  input[type=text],textarea{
    width:100%;font-family:inherit;font-size:15px;font-weight:700;padding:7px 9px;
    border:2px solid #05101f;border-radius:1px;background:#fff;color:var(--ink);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.2)
  }
  textarea{min-height:160px;font-weight:400;line-height:1.55;resize:vertical}
  input:focus-visible,textarea:focus-visible{outline:3px solid #ffe870;outline-offset:0}

  /* campo de lista: renglones en verde de cancha con letra blanca */
  .taWrap{position:relative}
  textarea.lined{
    --rh:30px;
    line-height:var(--rh);font-size:16px;font-weight:700;letter-spacing:.2px;color:#fff;caret-color:var(--gold1);
    text-shadow:0 1px 2px rgba(0,0,0,.55);
    padding:6px 14px;min-height:360px;
    background-color:#2f7d2c;background-attachment:local;background-repeat:repeat;background-position:0 6px;
    background-image:repeating-linear-gradient(180deg,
      #3a8f35 0 calc(var(--rh) - 1px),#14401a calc(var(--rh) - 1px) var(--rh),
      #2e7c2b var(--rh) calc(var(--rh)*2 - 1px),#14401a calc(var(--rh)*2 - 1px) calc(var(--rh)*2))
  }
  textarea.lined::placeholder{color:rgba(255,255,255,.65);font-weight:500;text-shadow:none}

  /* globo de validacion en vivo */
  .pop{
    position:absolute;right:12px;bottom:12px;max-width:calc(100% - 24px);z-index:2;
    padding:7px 13px;border:2px solid #05101f;border-radius:3px;
    font-size:13px;font-weight:700;letter-spacing:.2px;line-height:1.3;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.55);
    box-shadow:0 3px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3);
    animation:popIn .2s cubic-bezier(.2,.9,.3,1.3)
  }
  .pop[hidden]{display:none}
  .taWrap .pop{border-color:#fff;box-shadow:0 0 0 2px #05101f,0 4px 12px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.3)}
  .pop.inline{position:relative;display:block;margin-top:6px;max-width:none;animation:none}
  .pop b{color:#ffe870}
  .pop{--st:#5ddf3a;padding-left:20px;background:linear-gradient(180deg,var(--nav1),var(--nav2))}
  .pop::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--st)}
  .pop.ok{--st:#5ddf3a}
  .pop.warn{--st:#f2a93b}
  .pop.bad{--st:#ef5b50}
  @keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}

  .arrows{display:flex;gap:4px;margin-top:6px}
  .arrows button{
    flex:1;background:linear-gradient(180deg,#f2f5f8,#c6cdd7);border:1px solid #6b7686;
    padding:9px 2px;cursor:pointer;display:grid;place-items:center
  }
  .arrows button.on{background:linear-gradient(180deg,var(--gold1),var(--gold2));border-color:var(--goldbd)}
  .arrows button:disabled{opacity:.35;cursor:not-allowed}

  .alert{
    grid-column:1/-1;background:linear-gradient(180deg,var(--red1),var(--red2));color:#fff;
    border:2px solid #05101f;padding:6px 10px;font-size:13px;font-weight:700;text-align:center;
    text-shadow:1px 1px 0 #000
  }
  .alert b{color:#ffe870}


  /* ---- carrusel de la pantalla inicial ---- */
  .carousel{position:relative;overflow:hidden;padding:2px}
  .stage.single .carousel{
    max-width:430px;margin:0 auto;
    height:clamp(400px, calc(100vh - 150px), 660px)
  }
  .track{display:flex;align-items:stretch;height:100%;
    transition:transform .34s cubic-bezier(.25,.85,.3,1);will-change:transform}
  .track.dragging{transition:none}
  .cslide{min-width:100%;flex:0 0 100%;padding:0 3px;display:flex}
  .card{
    display:flex;flex-direction:column;padding:0;cursor:pointer;overflow:hidden;width:100%;height:100%;
    background:#0d1728;border:2px solid #05101f;border-radius:12px;
    font-family:inherit;text-align:center;color:#fff;
    box-shadow:0 7px 20px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14)
  }
  .card:focus-visible{outline:3px solid #ffe870;outline-offset:2px}
  .card .art{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#0d1728}
  .card .art{container-type:size}

  /* dibujo de cancha (tarjeta Importar lista): todo en cqw/cqh para ajustarse a la caja */
  .apitch{position:absolute;inset:0;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#1b2129,#0c1015);font-size:clamp(9px,3.7cqw,20px)}
  .ap-hd{margin:4cqh 4cqw 0;padding:.55em .9em;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#2b3138,#0b0f14);border:2px solid #05101f;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);color:#fff;font-weight:700;letter-spacing:.22em;font-size:.95em}
  .ap-field{position:relative;isolation:isolate;flex:1;min-height:0;margin-top:3cqh;
    display:flex;flex-direction:column;justify-content:space-around;padding:3cqh 1cqw 5cqh}
  .ap-field::before{content:'';position:absolute;inset:0;z-index:-1;clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);
    background:
      radial-gradient(circle at 50% -6%,transparent 0 13cqw,rgba(255,255,255,.16) 13cqw 13.7cqw,transparent 13.7cqw),
      linear-gradient(180deg,#434c56,#2a3139)}
  .ap-field::after{content:'';position:absolute;z-index:-1;left:20%;right:20%;bottom:0;height:34%;
    border:2px solid rgba(255,255,255,.22);border-bottom:none;
    background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.22)) center bottom/42% 40% no-repeat}
  .ap-line{display:flex;justify-content:space-evenly;align-items:flex-start;gap:.5em}
  .apitch .pl{max-width:none}
  .apitch .dot{width:.85em;height:.85em}
  .apitch .plate{font-size:1em;padding:.22em .85em}
  .apitch .plate.gk{background:linear-gradient(180deg,#3d86ff,#0a44d8);color:#fff;border:1px solid #03246b;
    text-shadow:0 1px 1px rgba(0,0,0,.45)}

  /* dibujo de tabla (tarjeta Formato liga) */
  .atabla{position:absolute;inset:0;display:flex;flex-direction:column;gap:.35em;padding:3.5cqh 3.5cqw;
    background:linear-gradient(180deg,#16294a,#0a1428);font-size:clamp(8.5px,3.3cqw,17px)}
  .at-tt{padding:.5em .8em;text-align:center;font-weight:700;letter-spacing:.2em;color:#fff;font-size:.95em;
    background:linear-gradient(180deg,#2b3138,#0b0f14);border:2px solid #05101f;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
  .at-th,.at-tr{display:grid;grid-template-columns:1.8em 1fr repeat(5,1.9em);align-items:center;column-gap:.15em}
  .at-th{background:linear-gradient(180deg,#3b4655,#1a222d);color:#e4eaf1;font-weight:700;padding:.3em .3em .3em 0;border:1px solid #05101f;font-size:.9em}
  .at-th b{text-align:center}
  .at-body{flex:1;min-height:0;display:flex;flex-direction:column;border:2px solid #05101f;background:#05101f;gap:1px}
  .at-tr{flex:1;min-height:0;color:#12233d;font-weight:700;background:linear-gradient(180deg,#e9edf2,#c3ccd8)}
  .at-tr:nth-child(even){background:linear-gradient(180deg,#dfe4eb,#b8c1cd)}
  .at-tr.first{background:linear-gradient(180deg,#fff3a8,#e6bf2e)}
  .at-tr b{display:grid;place-items:center;height:100%;background:rgba(0,0,0,.09);font-size:.95em}
  .at-pos{text-align:center;font-weight:900}
  .at-name{display:flex;align-items:center;gap:.5em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .at-crest{flex:0 0 auto;width:1.25em;height:1.4em;border:1px solid #05101f;
    clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%)}
  .card .band{flex:0 0 auto;padding:16px 18px 20px}
  .card.blue .band{background:linear-gradient(180deg,#4784d3,#1c3d7c);color:#fff}
  .card.gold .band{background:linear-gradient(180deg,#f2f5f8,#c3ccd8);color:#12233d}
  .card h3{margin:0 0 8px;font-size:17px;letter-spacing:1.6px;font-weight:700}
  .card p{margin:0;font-size:12px;line-height:1.6;opacity:.92}

  .cnav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:34px;height:52px;cursor:pointer;
    background:linear-gradient(180deg,rgba(90,107,128,.92),rgba(13,20,29,.92));
    border:1px solid #05101f;border-radius:4px;color:#fff;font-size:18px;font-weight:900;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.5)
  }
  .cnav:hover{background:linear-gradient(180deg,#ffe870,#c99a08);color:#101820}
  .cnav.prev{left:8px} .cnav.next{right:8px}
  .cdots{display:flex;justify-content:center;gap:9px;padding:12px 4px 4px}
  .cdots button{width:11px;height:11px;padding:0;border-radius:50%;cursor:pointer;
    background:#5b6b80;border:1px solid #05101f;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  .cdots button.on{background:linear-gradient(180deg,#ffe870,#dfae15);transform:scale(1.25)}

  .card:hover{box-shadow:0 9px 26px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.22)}
  .card:hover .band{filter:brightness(1.08)}

  /* selector de formato liga */
  .strow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 4px}
  .strow label{font-size:15px;font-weight:700;color:#12233d}
  .stepper{display:flex;align-items:stretch;border:2px solid #05101f;background:#fff}
  .stbtn{width:44px;font-family:inherit;font-size:22px;font-weight:900;cursor:pointer;color:#101820;border:none;
    background:linear-gradient(180deg,#f2f5f8,#c6cdd7)}
  .stbtn:hover:not(:disabled){background:linear-gradient(180deg,var(--gold1),var(--gold2))}
  .stbtn:disabled{opacity:.35;cursor:not-allowed}
  .stval{min-width:54px;display:grid;place-items:center;font-size:22px;font-weight:700;color:#101820;
    border-left:2px solid #05101f;border-right:2px solid #05101f}

  /* cartel de confirmacion */
  .modal-ov{position:fixed;inset:0;z-index:50;background:rgba(3,10,25,.72);display:grid;place-items:center;padding:18px;
    animation:ovIn .15s ease-out}
  .modal{width:100%;max-width:430px;background:linear-gradient(180deg,var(--steel-hi),var(--steel-mid) 58%,var(--steel-lo));
    border:2px solid #05101f;box-shadow:inset 0 1px 0 #fff,0 14px 40px rgba(0,0,0,.65);padding:6px;
    animation:popIn .2s cubic-bezier(.2,.9,.3,1.3)}
  .modal p{margin:10px 8px 12px;font-size:17px;font-weight:700;line-height:1.4;color:#101820;text-align:center}
  @keyframes ovIn{from{opacity:0}to{opacity:1}}

  /* varios equipos (formato liga) */
  .stage.multi{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
  .phead.kit{background:linear-gradient(180deg,var(--tc),var(--tc2));color:var(--ink-c,#fff)}
  .thead .sw{background:var(--tc)}
  .stage.multi .plate{font-size:11px;padding:3px 6px}
  .stage.multi .pl{max-width:96px}

  /* iconos de nivel especiales */
  .lic{display:block;flex:0 0 auto;object-fit:contain}

  .snd{
    background:linear-gradient(180deg,#5a6b80,#141c26);color:#fff;border:1px solid #05101f;
    border-radius:3px;width:32px;height:26px;margin:auto 8px;cursor:pointer;font-size:13px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3)
  }
  .snd:hover{background:linear-gradient(180deg,#ffe870,#c99a08);color:#101820}

  /* ---- barra de comandos ---- */
  .cmdbar{
    background:linear-gradient(180deg,#2a3441,#080c12 55%,#000);
    border-top:2px solid #05101f;box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
    padding:9px 10px;display:flex;flex-direction:column;align-items:stretch;gap:5px
  }
  .cmdbar:empty{display:none}
  .cmd{
    display:flex;align-items:center;gap:8px;cursor:pointer;
    --acc:#8fa0b5; --acc2:#3d4c5e;
    background:linear-gradient(180deg,#5a6b80,#1b2531 52%,#0d141d);
    border:1px solid #05101f;border-radius:3px;
    color:#fff;font-family:inherit;font-size:13px;font-weight:700;font-style:italic;letter-spacing:.3px;
    width:100%;justify-content:flex-start;text-align:left;
    padding:9px 14px 9px 8px;text-shadow:1px 1px 0 #000;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 0 rgba(0,0,0,.6)
  }
  .cmd:hover:not(:disabled){
    background:linear-gradient(180deg,var(--acc),var(--acc2));
    border-color:#05101f;color:#0a1017;text-shadow:0 1px 0 rgba(255,255,255,.45)}
  .cmd:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 2px 4px rgba(0,0,0,.55)}
  .cmd:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .cmd:disabled{opacity:.32;cursor:not-allowed;box-shadow:none}
  .cmd .k{
    width:22px;height:22px;border-radius:3px;display:grid;place-items:center;font-size:13px;
    font-style:normal;font-weight:900;line-height:1;color:#0a1017;
    background:linear-gradient(180deg,var(--acc),var(--acc2));
    border:1px solid rgba(0,0,0,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .cmd:hover:not(:disabled) .k{background:linear-gradient(180deg,#fff,#dfe6ee)}

  .t-back {--acc:#f07a70; --acc2:#8f2b24}
  .t-home {--acc:#b79bf0; --acc2:#4e2f9c}
  .t-go   {--acc:#7ede81; --acc2:#1f7a28}
  .t-alt  {--acc:#f7b45c; --acc2:#a35d0c}
  .t-rand {--acc:#6fc4ef; --acc2:#155e93}
  .t-share{--acc:#5df08c; --acc2:#0f8a3d}
  .t-edit {--acc:#ffe870; --acc2:#b98c05}
  .t-del  {--acc:#f2938a; --acc2:#8c2119}
  .cmd .k svg,.snd svg,.cnav svg{display:block;margin:auto}
  .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);margin:3px 0}

  /* ---- slides ---- */
  .slide{animation:slideIn .24s cubic-bezier(.2,.7,.3,1)}
  @keyframes slideIn{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ .slide{animation:none} }
  .slidename{
    background:linear-gradient(180deg,#132340,#0a1428);color:#fff;border:2px solid #05101f;
    text-align:center;font-size:28px;font-weight:700;font-style:italic;padding:16px 10px;
    margin-bottom:6px;text-shadow:2px 2px 0 #000;overflow-wrap:anywhere
  }
  .dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;padding:8px 4px 3px}
  .dot{width:9px;height:9px;border-radius:50%;background:#8996a6;border:1px solid #05101f}
  .dot.done{background:var(--a3)}
  .dot.cur{background:var(--gold1);transform:scale(1.45)}

  /* ---- cancha (estilo plantel de PES) ---- */
  .thead{
    display:flex;align-items:center;gap:10px;padding:9px 14px;margin-bottom:6px;
    background:linear-gradient(180deg,#2b3138,#0b0f14);border:2px solid #05101f;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
    color:#fff;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase
  }
  .thead .sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;flex:0 0 auto;
    box-shadow:0 1px 3px rgba(0,0,0,.6)}
  .thead.claro .sw{background:radial-gradient(circle at 35% 30%,#fff,#c3cbd4)}
  .thead.oscuro .sw{background:radial-gradient(circle at 35% 30%,#56616d,#090c10)}

  .pitch{
    position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:space-around;
    gap:18px;min-height:320px;padding:26px 6px 14px;overflow:hidden;
    background:linear-gradient(180deg,#171c22,#0d1116);border:2px solid #05101f
  }
  .pitch::before{
    content:'';position:absolute;inset:0;z-index:-1;
    clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);
    background:
      radial-gradient(circle at 50% -6%,transparent 0 52px,rgba(255,255,255,.16) 52px 54px,transparent 54px),
      linear-gradient(180deg,#434c56,#2a3139)
  }
  .pitch::after{
    content:'';position:absolute;z-index:-1;left:20%;right:20%;bottom:0;height:30%;
    border:2px solid rgba(255,255,255,.22);border-bottom:none;
    background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.22)) center bottom/42% 42% no-repeat;
  }
  .pline{display:flex;justify-content:space-evenly;align-items:flex-start;gap:12px 6px;flex-wrap:wrap}
  .pl{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;max-width:112px}
  .pl .dot{width:12px;height:12px;border-radius:50%;border:1px solid #05101f;
    box-shadow:inset 0 -2px 3px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.6)}
  .dot.d-del{background:radial-gradient(circle at 35% 30%,#ff9288,#c4241b)}
  .dot.d-med{background:radial-gradient(circle at 35% 30%,#8be879,#2c9a1f)}
  .dot.d-def{background:radial-gradient(circle at 35% 30%,#8fb4ff,#2352b8)}
  .dot.d-por{background:radial-gradient(circle at 35% 30%,#fff09a,#d7a60c)}
  .plate{
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    background:linear-gradient(180deg,#fff,#cdd3da);color:#121820;
    font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
    padding:3px 10px;border-radius:2px;
    box-shadow:0 2px 4px rgba(0,0,0,.65),inset 0 -2px 0 rgba(0,0,0,.18)
  }
  .pitch.oscuro .plate{
    background:linear-gradient(180deg,#3b434d,#10151b);color:#fff;
    border:1px solid rgba(255,255,255,.5)
  }
  .pitch .plate.gk{
    background:linear-gradient(180deg,#3d86ff,#0a44d8);color:#fff;border:1px solid #03246b;
    text-shadow:0 1px 1px rgba(0,0,0,.45)
  }

  /* ============================================================
     PULIDO VISUAL
     ============================================================ */

  /* selección de texto en la paleta de la app */
  ::selection{background:var(--gold1);color:#101820}

  /* barras de scroll oscuras: la clara rompía el panel azul */
  .list,textarea{scrollbar-width:thin;scrollbar-color:#4a5a6e #0a1428}
  .list::-webkit-scrollbar,textarea::-webkit-scrollbar{width:10px;height:10px}
  .list::-webkit-scrollbar-track,textarea::-webkit-scrollbar-track{background:#0a1428}
  .list::-webkit-scrollbar-thumb,textarea::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,#63758c,#26313f);
    border:1px solid #05101f;border-radius:2px}
  .list::-webkit-scrollbar-thumb:hover,textarea::-webkit-scrollbar-thumb:hover{
    background:linear-gradient(180deg,var(--gold1),var(--gold2))}

  /* transiciones cortas: el cambio de estado ya no es un salto seco */
  .row,.mbtn,.arrows button,.cmd,.card,.cnav,.snd,.cdots button,.del{
    transition:background .15s ease,border-color .15s ease,color .15s ease,
               box-shadow .15s ease,transform .1s ease}

  /* foco visible uniforme para teclado */
  button:focus-visible,input:focus-visible,textarea:focus-visible{
    outline:3px solid var(--gold1);outline-offset:2px}

  /* la fila seleccionada gana una barra de acento a la izquierda */
  .row.sel{position:relative;padding-left:12px}
  .row.sel::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,var(--gold1),var(--gold2))}

  /* el aviso rojo respira un poco mejor */
  .alert{border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}

  /* estados deshabilitados coherentes en toda la app */
  button:disabled{filter:saturate(.5)}

  /* pantallas chicas: la barra superior dejaba de entrar */
  @media (max-width:520px){
    body{padding:6px}
    .tv{border-width:2px}
    .ttl{font-size:13px;letter-spacing:.5px;padding:6px 4px}
    .tag,.count{padding:5px 12px}
    .tag b,.count b{font-size:10px}
    .snd{width:28px;height:24px;margin:auto 5px}
    .stage{padding:9px;gap:8px}
    .stage.single .carousel{height:clamp(340px,calc(100vh - 130px),560px)}
    .card h3{font-size:15px;letter-spacing:1.1px}
    .card p{font-size:11px}
    .mbtn{font-size:14px;padding:10px 30px}
    .slidename{font-size:22px;padding:12px 8px}
    .cmd{font-size:12px;padding:8px 12px 8px 7px}
    .list{max-height:44vh}
    .thead{font-size:12px;letter-spacing:1.2px;padding:7px 10px}
    .pitch{gap:14px;padding:20px 2px 12px}
    .pl{max-width:86px}
    .plate{font-size:10px;padding:3px 5px;letter-spacing:0}
  }

  /* ---- escritorio: la app ocupa la ventana en vez de quedar chica arriba ---- */
  @media (min-width:1024px){
    body{padding:20px 28px}
    .tv{
      max-width:1360px;min-height:calc(100vh - 40px);border-radius:6px;
      display:flex;flex-direction:column;
    }
    .stage{flex:1 1 auto;align-content:center;padding:22px;gap:18px}
    .stage.single{max-width:760px;width:100%}
    .stage.single .carousel{max-width:560px;height:clamp(460px,calc(100vh - 260px),760px)}
    .topbar{min-height:54px}
    .tag{padding:8px 28px}
    .tag b,.count b{font-size:15px}
    .count{padding:8px 24px}
    .ttl{font-size:21px}
    .phead{font-size:14px;padding:7px 12px;margin-bottom:7px}
    .panel{padding:8px}
    .list{max-height:calc(100vh - 380px);min-height:220px;gap:4px;padding:5px}
    .row{font-size:17px;padding:10px 14px}
    .row .del{width:28px;height:28px}
    .sbox h4{font-size:13px;padding:5px 10px}
    .sbox p{font-size:24px;padding:9px 6px}
    .sbox p.sm{font-size:17px}
    input[type=text],textarea{font-size:17px;padding:11px 13px}
    textarea.lined{--rh:34px;min-height:max(408px,calc(100vh - 460px));font-size:18px;padding:6px 18px}
    .pop{font-size:15px;padding:9px 16px 9px 24px}
    .mbtn{font-size:18px;padding:15px 40px}
    .alert{font-size:15px;padding:10px 14px}
    .cmdbar{padding:14px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
    .cmd{font-size:15px;padding:12px 16px 12px 10px}
    .cmd .k{width:26px;height:26px}
    .slidename{font-size:38px;padding:24px 14px}
    .thead{font-size:17px;padding:12px 18px}
    .pitch{min-height:430px;gap:24px;padding:34px 10px 18px}
    .pl{max-width:150px}
    .plate{font-size:15px;padding:4px 14px}
  }

  /* respeto por quien pide menos animacion */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none !important;animation:none !important}
    .track{transition:none}
  }
</style>
</head>

// ---------- parser ----------
// Datos del partido (cancha, hora, fecha, precio): nunca son jugadores.
const META_KW = /\b(cancha|campo|complejo|predio|lugar|horario|fecha)\b/i;
const TIME_RE = /\b(?:[01]?\d|2[0-3])[:.][0-5]\d\b|\b(?:[01]?\d|2[0-3])\s*(?:hs|hrs?|h|horas?)\b/i;
const DATE_RE = /\b\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?\b/;
const isMeta = s => META_KW.test(s) || TIME_RE.test(s) || DATE_RE.test(s) || /\$\s*\d/.test(s);

// Texto de cancha/hora que viene en la lista: se recuerda para el mensaje de WhatsApp.
function cleanInfo(x){
  const v = x.replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,'')
    .replace(/\$\s*\d[\d.,]*/g,'')                               // el precio no se comparte
    .replace(/\s+/g,' ').replace(/^[\s\-–—:·•|,;]+|[\s\-–—:·•|,;]+$/g,'');
  if(!/\p{L}/u.test(v) || v.length < 3 || /^(cancha|campo|complejo|predio|lugar|horario|fecha)$/i.test(v)) return '';
  return v.slice(0,60);
}

function parseAll(text){
  let t = String(text).replace(/\r/g,'').replace(/[*_`~]/g,'');   // negritas de whatsapp
  const info = [];
  const keep = x => { const v = cleanInfo(x); if(v && !info.includes(v)) info.push(v); };

  // Linea con cancha/hora/fecha => no es jugador: se omite entera y se recuerda como dato del
  // partido. Si trae separadores (lista en horizontal), se conserva y se descartan solo los items de datos.
  t = t.split('\n').filter(l => {
    if(!isMeta(l) || /[,;•|]/.test(l)) return true;
    keep(l); return false;
  }).join('\n');

  // Toda numeracion ("1. Timo", "1 Timo", "1-Timo", "10Gallo") pasa a ser un corte de item.
  const multi = /[\n,;]/.test(t);
  const numRe = multi
    ? /(^|[\n,;•·|\/]|[ \t](?=[\(\[]?\d{1,3}[\)\].\-–:]))[ \t]*[\(\[]?\d{1,3}[\)\].\-–:]*[ \t]*(?=\p{L})/gu
    : /(^|\s)[ \t]*[\(\[]?\d{1,3}[\)\].\-–:]*[ \t]*(?=\p{L})/gu;
  t = t.replace(numRe, '\n');

  const junk = /^(lista|jugadores?|equipos?|anotados?|confirmados?|suplentes|van|faltan|cancha|f[uú]tbol|futsal|partido|hola|buenas|resumen|total|hs|hrs|s[aá]bado|domingo|lunes|martes|mi[eé]rcoles|jueves|viernes)$/i;
  const conn = /^(de|del|la|el|los|las)$/i;
  const clean = w => w.replace(/[^\p{L}\p{N}'.\-]/gu,'').replace(/^[\d.\-–']+|[\d.\-–']+$/gu,'');

  // Un item (renglon o trozo entre separadores) de 1-2 palabras es UN jugador ("amigo fabi").
  // Con 3 o mas palabras sueltas es una lista en horizontal: cada palabra es un jugador
  // ("amigo de fabi" se mantiene junto por el conector).
  const items = s => {
    const ws = s.split(/\s+/).map(clean).filter(w => /\p{L}/u.test(w) && !junk.test(w));
    while(ws.length && conn.test(ws[0])) ws.shift();
    while(ws.length && conn.test(ws[ws.length-1])) ws.pop();
    if(ws.length <= 2) return ws.length ? [ws.join(' ')] : [];
    const out = [];
    for(let i=0; i<ws.length; i++){
      if(conn.test(ws[i]) && out.length && i+1 < ws.length) out[out.length-1] += ' '+ws[i]+' '+ws[++i];
      else out.push(ws[i]);
    }
    return out;
  };

  const tokens = t.split(/[\n\t,;•·|\/]+|\s[-–—]\s/)
    .filter(seg => { if(!isMeta(seg)) return true; keep(seg); return false; })
    .flatMap(items)
    .filter(w => w.length >= 2 && w.length <= 24);

  return {names:tokens, info:info.join(' · ')};
}
const parseList = text => parseAll(text).names;

// Nombres repetidos: invalidan la lista hasta que se cambien.
const nameKey = s => s.trim().toLowerCase();
function dupInfo(names){
  const first = new Set(), dup = new Set(), later = new Set();
  names.forEach((nm,i)=>{
    const k = nameKey(nm);
    if(first.has(k)){ dup.add(k); later.add(i); } else first.add(k);
  });
  return {dup, later};
}
function suggestName(base, taken){
  for(let i=2;;i++){ const s = base+' '+i; if(!taken.has(nameKey(s))){ taken.add(nameKey(s)); return s; } }
}
function listStatus(names, extra){
  const n = names.length;
  if(!n) return null;
  const {dup, later} = dupInfo(names);
  const plural = n===1 ? 'jugador' : 'jugadores';
  if(dup.size){
    const i = [...later][0];
    return {kind:'bad', html:'<b>'+n+'</b> '+plural+' · nombre repetido: <b>'+esc(names[i].trim())+'</b>'};
  }
  if(S.mode==='liga'){
    const L = S.liga, t = L.teams * L.per, d = t - n, fm = L.teams+' equipos de '+L.per;
    if(!d) return {kind:'ok', html:'<b>'+n+'</b> jugadores · <b>'+fm+'</b> ✓'};
    return {kind:'warn', html:'<b>'+n+'</b> '+plural+' · '+fm+': '+
      (d>0 ? 'falta'+(d>1?'n':'')+' <b>'+d+'</b>' : 'sobra'+(d<-1?'n':'')+' <b>'+(-d)+'</b>')};
  }
  if(n < 4) return {kind:'warn', html:'<b>'+n+'</b> '+plural+' · cargá al menos 4'};
  const c = canchaFor(n);
  if(c) return {kind:'ok', html:'<b>'+n+'</b> jugadores · <b>'+c.label+'</b> ✓'};
  const po = plusOne(n);
  if(po){
    const hi = CANCHAS.find(x=>x.n>n);
    return {kind:'warn', html:'<b>'+n+'</b> jugadores · <b>'+po.label+' +1</b>'+(hi ? ' · o '+hi.label+': falta <b>'+(hi.n-n)+'</b>' : '')};
  }
  const lo = CANCHAS.filter(x=>x.n<n).pop(), hi = CANCHAS.find(x=>x.n>n);
  const parts = [];
  if(lo) parts.push(lo.label+': sobra'+(n-lo.n>1?'n':'')+' <b>'+(n-lo.n)+'</b>');
  if(hi) parts.push(hi.label+': falta'+(hi.n-n>1?'n':'')+' <b>'+(hi.n-n)+'</b>');
  return {kind:'warn', html:'<b>'+n+'</b> jugadores · '+parts.join(' · ')};
}
function setPop(el, st){
  if(!st){ el.hidden = true; return; }
  const was = el.dataset.kind;
  el.hidden = false;
  el.className = el.className.replace(/\b(ok|warn|bad)\b/g,'').trim() + ' ' + st.kind;
  el.innerHTML = st.html;
  if(was !== st.kind){ el.style.animation='none'; void el.offsetWidth; el.style.animation=''; }
  el.dataset.kind = st.kind;
}
const canchaFor = n => CANCHAS.find(c => c.n === n) || null;
const plusOne = n => CANCHAS.find(c => c.n + 1 === n) || null;
function matchFor(n){
  if(S.mode==='liga'){
    const t = S.liga.teams * S.liga.per;
    return {ok:n===t, kind:'liga', label:'Liga '+S.liga.teams+'×'+S.liga.per, total:t};
  }
  const c = canchaFor(n);
  if(c) return {ok:true, kind:'exact', c, label:c.label};
  const po = plusOne(n);
  if(po) return {ok:true, kind:'plus', c:po, label:po.label+' +1'};
  return {ok:false, kind:'none'};
}
function perTeamText(n){
  if(S.mode==='liga') return String(S.liga.per);
  return n % 2 ? ((n+1)/2)+' / '+((n-1)/2) : String(n/2);
}
function askModal(o, onYes){
  const ov = document.createElement('div');
  ov.className = 'modal-ov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true');
  ov.innerHTML = '<div class="modal"><div class="phead">'+esc(o.title||'ATENCIÓN')+'</div><p>'+esc(o.text)+'</p>'+
    '<div class="menu"><button class="mbtn" data-yes="1">'+esc(o.yes||'Sí')+'</button>'+
    '<button class="mbtn" data-no="1">'+esc(o.no||'No')+'</button></div></div>';
  const close = () => { ov.remove(); window.removeEventListener('keydown', onKey, true); };
  const onKey = e => { if(e.key==='Escape'){ e.stopImmediatePropagation(); e.preventDefault(); close(); } };
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
  ov.querySelector('[data-no]').addEventListener('click', close);
  ov.querySelector('[data-yes]').addEventListener('click', ()=>{ close(); onYes(); });
  window.addEventListener('keydown', onKey, true);
  document.body.appendChild(ov);
  ov.querySelector('[data-yes]').focus();
}

// ---------- algoritmo ----------
function costOf(A,B){
  let sA=0,sB=0; const cA=[0,0,0,0,0,0], cB=[0,0,0,0,0,0];
  for(const p of A){ const v=scoreOf(p); sA+=v; cA[v]++; }
  for(const p of B){ const v=scoreOf(p); sB+=v; cB[v]++; }
  const nA=A.length, nB=B.length, m=(nA+nB)/2;          // con tamanos iguales se reduce a |sA-sB|
  const target = (gkTotal()===1) ? -GK_HANDICAP : 0;
  const dSum = Math.abs((sA*nB - sB*nA)*m/(nA*nB) - target);
  let dDist = 0;
  for(let v=1; v<=5; v++) dDist += Math.abs(cA[v]*m/nA - cB[v]*m/nB);
  return { cost: W_SUMA*dSum + W_DIST*dDist };
}
function* combinations(pool,k){
  const n = pool.length;
  if(k>n || k<0) return;
  const idx = Array.from({length:k},(_,i)=>i);
  while(true){
    yield idx.map(i=>pool[i]);
    let i = k-1;
    while(i>=0 && idx[i] === i+n-k) i--;
    if(i<0) return;
    idx[i]++;
    for(let j=i+1;j<k;j++) idx[j] = idx[j-1]+1;
  }
}
function nCk(n,k){ let r=1; for(let i=1;i<=k;i++) r = r*(n-k+i)/i; return r; }

function buildCandidates(){
  S.players.forEach(p=>{ if(p.arrow===7) p.rv = Math.random()<0.5 ? 2 : 3; });   // Random: Irregular o Regular
  if(S.mode==='liga'){ buildLiga(); applyLabels(); return; }
  const P = S.players, n = P.length;
  const gkIdx = [], free = [];
  P.forEach((p,i)=> p.isGK ? gkIdx.push(i) : free.push(i));
  const forcedA = [];
  if(gkIdx.length >= 1) forcedA.push(gkIdx[0]);
  const gk2 = gkIdx.length >= 2 ? gkIdx[1] : -1;
  if(forcedA.length === 0 && free.length) forcedA.push(free.shift());
  const pool = free.filter(i => i !== gk2);
  const sizes = n % 2 ? [(n-1)/2, (n+1)/2] : [n/2];       // con un jugador de mas, el equipo A puede ser el chico o el grande

  let best = Infinity, cands = [];
  sizes.forEach(sizeA=>{
    const needA = sizeA - forcedA.length;
    if(needA < 0 || needA > pool.length) return;
    const evaluate = pick => {
      const setA = new Set(forcedA.concat(pick));
      const A=[],B=[],ia=[],ib=[];
      P.forEach((p,i)=>{ if(setA.has(i)){ A.push(p); ia.push(i); } else { B.push(p); ib.push(i); } });
      const m = costOf(A,B);
      if(m.cost < best){ best = m.cost; cands = cands.filter(c=>c.cost <= best+TOL); }
      if(m.cost <= best+TOL && cands.length < 600) cands.push({cost:m.cost, t:[ia,ib]});
    };
    if(nCk(pool.length, needA) <= MAX_COMBOS){ for(const pick of combinations(pool,needA)) evaluate(pick); }
    else { for(let t=0;t<120000;t++) evaluate(shuffle(pool.slice()).slice(0,needA)); }
  });

  const seen = new Set();
  cands = cands.filter(c=>{ const k=c.t[0].join(','); if(seen.has(k)) return false; seen.add(k); return true; });
  cands.sort((x,y)=>x.cost-y.cost);
  S.cands = cands.slice(0,40); S.candIdx = 0;
  applyLabels();
}

// Formato liga: k equipos de igual tamano. Reparto goloso por puntaje + mejora por intercambios.
function buildLiga(){
  const P = S.players, k = S.liga.teams, per = S.liga.per;
  const gk = [], oth = [];
  P.forEach((p,i)=> p.isGK ? gk.push(i) : oth.push(i));
  const sc = i => scoreOf(P[i]);
  const stats = teams => {
    const sums = teams.map(t=>t.reduce((a,i)=>a+sc(i),0));
    const cnt = teams.map(t=>{ const c=[0,0,0,0,0,0]; t.forEach(i=>c[sc(i)]++); return c; });
    const spread = Math.max(...sums) - Math.min(...sums);
    let dist = 0;
    for(let v=1; v<=5; v++){ const col = cnt.map(c=>c[v]); dist += Math.max(...col) - Math.min(...col); }
    return {cost: W_SUMA*spread + W_DIST*dist, spread};
  };
  const make = () => {
    const teams = Array.from({length:k},()=>[]);
    shuffle(gk.slice()).forEach((i,j)=> teams[j%k].push(i));                // un arquero por equipo
    const order = shuffle(oth.slice()).sort((a,b)=>sc(b)-sc(a));
    const sum = t => t.reduce((a,i)=>a+sc(i),0);
    order.forEach(i=>{
      let bi = -1, bs = Infinity;
      teams.forEach((t,ti)=>{ if(t.length < per){ const v = sum(t) + Math.random()*0.5; if(v < bs){ bs = v; bi = ti; } } });
      teams[bi].push(i);
    });
    return teams;
  };
  const improve = teams => {
    let cur = stats(teams).cost;
    for(let it=0; it<500; it++){
      const a = Math.floor(Math.random()*k); let b = Math.floor(Math.random()*(k-1)); if(b >= a) b++;
      const ia = Math.floor(Math.random()*per), ib = Math.floor(Math.random()*per);
      const x = teams[a][ia], y = teams[b][ib];
      if(P[x].isGK !== P[y].isGK) continue;
      teams[a][ia] = y; teams[b][ib] = x;
      const c = stats(teams).cost;
      if(c <= cur) cur = c; else { teams[a][ia] = x; teams[b][ib] = y; }
    }
    return cur;
  };
  const seen = new Set(); let cands = [];
  for(let r=0; r<80; r++){
    const t = make(); const cost = improve(t);
    const canon = t.map(x=>x.slice().sort((a,b)=>a-b)).sort((a,b)=>a[0]-b[0]);
    const key = canon.map(x=>x.join(',')).join('|');
    if(seen.has(key)) continue;
    seen.add(key);
    cands.push({cost, spread:stats(canon).spread, t:shuffle(canon.slice())});   // el orden al azar reparte los colores
  }
  cands.sort((x,y)=>x.cost-y.cost);
  S.cands = cands.slice(0,40); S.candIdx = 0;
}
function teamsCurrent(){
  const c = S.cands[S.candIdx];
  return {teams: c.t.map(arr=>arr.map(i=>S.players[i])), c};
}
function labelsFor(k){
  let def = Math.max(1, Math.round(k*0.4));
  let del = Math.max(1, Math.round(k*0.25));
  if(def+del > k){ del = 1; def = Math.max(1, k-2); }
  return {def, med: Math.max(0, k-def-del)};
}
function applyLabels(){
  if(!S.cands.length) return;
  teamsCurrent().teams.forEach(team=>{
    const out = shuffle(team.filter(p=>!p.isGK));
    const {def,med} = labelsFor(out.length);
    out.forEach((p,i)=> p.label = i<def ? 'DEF' : (i<def+med ? 'MED' : 'DEL'));
    team.filter(p=>p.isGK).forEach(p=> p.label='POR');
  });
}

/* ---- sonido de interfaz -------------------------------------
   Sintetizado en vivo con Web Audio. No hay archivos de audio:
   'move'    blip corto y brillante  (~1500 Hz)
   'confirm' tono grave con armonico (~360 Hz + 1500 Hz)
   'back'    barrido descendente     (~340 -> 190 Hz)
   ------------------------------------------------------------ */

/* Si existen archivos en assets/sfx/ se usan esos; si no, suena el sintetizado. */
const SOUND_FILES = {
  move:    'assets/sfx/move.wav',
  confirm: 'assets/sfx/confirm.wav',
  back:    'assets/sfx/back.wav'
};
const SOUND_VOL = 0.55;
const BUF = {};
let sfxTried = false;

function loadSounds(){
  if(sfxTried) return; sfxTried = true;
  const ac = actx(); if(!ac) return;
  Object.keys(SOUND_FILES).forEach(k=>{
    fetch(SOUND_FILES[k])
      .then(r => r.ok ? r.arrayBuffer() : Promise.reject(new Error('404')))
      .then(b => ac.decodeAudioData(b))
      .then(buf => { BUF[k] = buf; })
      .catch(()=>{});   // sin archivo, queda el sonido sintetizado
  });
}
function playFile(kind){
  const ac = actx(); if(!ac || !BUF[kind]) return false;
  const src = ac.createBufferSource(), g = ac.createGain();
  src.buffer = BUF[kind];
  g.gain.value = SOUND_VOL;
  src.connect(g).connect(ac.destination);
  src.start(0);
  return true;
}

let AC = null;
function actx(){
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(ac, t0, {freq, to, type, dur, vol, delay}){
  const o = ac.createOscillator(), g = ac.createGain();
  const t = t0 + (delay || 0);
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if(to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function beep(kind){
  if(!S.sound) return;
  const ac = actx(); if(!ac) return;
  loadSounds();
  if(playFile(kind)) return;
  const t = ac.currentTime;
  if(kind === 'confirm'){
    tone(ac,t,{freq:360,type:'triangle',dur:0.16,vol:0.16});
    tone(ac,t,{freq:1500,type:'square',dur:0.07,vol:0.05,delay:0.01});
  } else if(kind === 'back'){
    tone(ac,t,{freq:340,to:190,type:'square',dur:0.13,vol:0.11});
  } else {
    tone(ac,t,{freq:1500,type:'square',dur:0.045,vol:0.07});
  }
}

  else if(b.classList.contains('cnav') || b.parentElement && b.parentElement.classList.contains('cdots')) return;

    '<div class="panel"><div class="phead">ATAJOS</div><div class="menu">'+
      presets.map(([t,pp])=>'<button class="mbtn'+(L.teams===t&&L.per===pp?' on':'')+'" data-t="'+t+'" data-p="'+pp+'">'+
        t+' equipos de '+pp+'</button>').join('')+
    '</div></div>';
  st.querySelectorAll('.stbtn').forEach(b=> b.addEventListener('click',()=>{
    const k = b.dataset.k, lim = k==='teams' ? [LIGA_MIN_TEAMS,LIGA_MAX_TEAMS] : [LIGA_MIN_PER,LIGA_MAX_PER];
    L[k] = Math.max(lim[0], Math.min(lim[1], L[k] + (+b.dataset.d))); render();
  }));
  st.querySelectorAll('[data-t]').forEach(b=> b.addEventListener('click',()=>{
    L.teams = +b.dataset.t; L.per = +b.dataset.p; render();
  }));
  setCmd(navBack([cmd('formato')]));
}

function renderImportar(st){
  head('', S.mode==='liga' ? 'Liga · pegá la lista' : 'Pegá el mensaje','');
  st.className = 'stage single';
  st.innerHTML =
    '<div class="panel"><div class="phead">LISTA DE JUGADORES'+(S.mode==='liga' ? ' · '+S.liga.teams+' EQUIPOS DE '+S.liga.per : '')+'</div>'+
      '<div class="taWrap"><textarea id="rawIn" class="lined" placeholder="Pegá la lista como venga: 1. Timo / 2 Fabi / 3-Juan / 10Gallo / o separados por coma">'+esc(S.raw)+'</textarea>'+
        '<div class="pop" id="pop" role="status" aria-live="polite" hidden></div></div>'+
      '<div class="menu" style="margin-top:6px"><button class="mbtn" id="doParse">Leer la lista</button></div>'+
    '</div>'+ alertBox();
  $('doParse').addEventListener('click', ()=>{
    S.raw = $('rawIn').value;
    const {names, info} = parseAll(S.raw);
    if(names.length < 4){ S.alert = 'Solo detecté <b>'+names.length+'</b> nombre(s)'; render(); return; }
    S.alert=''; S.draft=names; S.venue=info; S.step='revisar'; render();
  });
  const paintPop = () => setPop($('pop'), listStatus(parseList($('rawIn').value)));
  $('rawIn').addEventListener('input', paintPop);
  paintPop();
  setCmd(navBack());
  $('rawIn').focus();
}

function renderRevisar(st){
  const n = S.draft.length, m = matchFor(n);
  head('REVISIÓN', m.ok ? m.label : 'Ajustá la lista', n + ' NOMBRES');
  st.className = 'stage';
  const {dup, later} = dupInfo(S.draft);
  const taken = new Set(S.draft.map(nameKey));
  const sug = {};
  S.draft.forEach((nm,i)=>{ if(later.has(i)) sug[i] = suggestName(nm, taken); });
  let warn = '';
  const warned = new Set();
  [...later].forEach(i=>{
    const k = nameKey(S.draft[i]);
    if(warned.has(k)) return;
    warned.add(k);
    warn += '<div class="alert">Nombre repetido: <b>'+esc(S.draft[i].trim())+'</b>. No se puede armar con dos iguales. '+
      'Tocá el nombre para editarlo (te traigo <b>'+esc(sug[i])+'</b>) y confirmá con Enter</div>';
  });
  if(m.kind==='plus'){
    warn += '<div class="alert">Son <b>'+n+'</b> en vez de <b>'+m.c.n+'</b> para un F'+m.c.id+': te voy a pedir confirmación al armar el plantel</div>';
  } else if(m.kind==='liga' && !m.ok){
    const d = m.total - n;
    warn += '<div class="alert">'+S.liga.teams+' equipos de '+S.liga.per+': '+(d>0 ? 'falta'+(d>1?'n':'')+' <b>'+d+'</b>' : 'sobra'+(d<-1?'n':'')+' <b>'+(-d)+'</b>')+'</div>';
  } else if(!m.ok){
    const near = CANCHAS.reduce((a,b)=> Math.abs(b.n-n) < Math.abs(a.n-n) ? b : a);
    const d = n - near.n;
    warn += '<div class="alert">'+near.label+': '+(d>0 ? 'sobra'+(d>1?'n':'')+' <b>'+d+'</b>' : 'falta'+(d<-1?'n':'')+' <b>'+(-d)+'</b>')+'</div>';
  }
  st.innerHTML =
    '<div class="panel"><div class="phead">NOMBRES DETECTADOS</div><div class="list">'+
      S.draft.map((nm,i)=>{
        const isDup = dup.has(nameKey(nm));
        return '<div class="row'+(isDup?' dup':'')+'" style="cursor:default">'+
        (isDup ? '<input type="text" class="nm-edit" data-edit="'+i+'" value="'+esc(nm)+'" maxlength="24" '+
                   'autocomplete="off" aria-label="Editar nombre repetido">'
               : '<span class="nm">'+esc(nm)+'</span>')+
        (isDup ? '<span class="badge rep">REPETIDO</span>' : '')+
        (later.has(i) ? '<button class="sug" data-sug="'+i+'">Usar '+esc(sug[i])+'</button>' : '')+
        '<button class="del" data-del="'+i+'" aria-label="Quitar">×</button></div>';
      }).join('')+
    '</div></div>'+
    '<div class="panel"><div class="phead">AGREGAR</div>'+
      '<input type="text" id="addIn" maxlength="18" placeholder="Nombre y Enter" autocomplete="off">'+
      '<div class="pop inline" id="pop" role="status" aria-live="polite" hidden></div>'+
      (S.venue ? '<div class="sbox" style="margin-top:6px"><h4>CANCHA Y HORA</h4><p class="sm">'+esc(S.venue)+'</p></div>' : '')+
      '<div class="sbox" style="margin-top:6px"><h4>MODALIDAD</h4><p class="sm">'+(m.ok?m.label:'—')+'</p></div>'+
      '<div class="sbox"><h4>POR EQUIPO</h4><p>'+(m.ok?perTeamText(n):'—')+'</p></div>'+
    '</div>'+ warn;
  st.querySelectorAll('[data-edit]').forEach(inp=>{
    const i = +inp.dataset.edit, orig = S.draft[i];
    let dirty = false;
    inp.addEventListener('focus', ()=>{
      if(sug[i]) inp.value = sug[i];
      inp.select();
    });
    inp.addEventListener('input', ()=>{ dirty = true; });
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        const v = inp.value.trim();
        if(v){ S.draft[i] = v; render(); }
      } else if(e.key==='Escape'){ inp.blur(); }
    });
    inp.addEventListener('blur', ()=>{
      const v = inp.value.trim();
      if(dirty && v && v !== orig){ S.draft[i] = v; render(); }
      else inp.value = orig;
    });
  });
  st.querySelectorAll('[data-sug]').forEach(b=> b.addEventListener('click',()=>{ S.draft[+b.dataset.sug] = sug[+b.dataset.sug]; render(); }));
  st.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click',()=>{ S.draft.splice(+b.dataset.del,1); render(); }));
  const paintPop = () => {
    const v = $('addIn').value.trim();
    if(!v){ setPop($('pop'), listStatus(S.draft)); return; }
    if(S.draft.some(x=>nameKey(x)===nameKey(v)))
      setPop($('pop'), {kind:'bad', html:'<b>'+esc(v)+'</b> ya está en la lista'});
    else setPop($('pop'), listStatus(S.draft.concat(v)));
  };
  $('addIn').addEventListener('input', paintPop);
  paintPop();
  $('addIn').addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.value.trim()){ S.draft.push(e.target.value.trim()); render(); $('addIn').focus(); }
  });
  setCmd(navBack([cmd('nivel',{off:!m.ok || dup.size>0})]));
}

function renderSlides(st){
  const total = S.players.length, i = S.slideIdx, p = S.players[i];
  const gk = gkTotal(), gkFull = gk >= MAX_GK && !p.isGK;
  head('ARMAR', p.name, '');
  st.className = 'stage single';
  st.innerHTML =
    '<div class="panel slide"><div class="slidename">'+esc(p.name)+'</div><div class="menu">'+
      '<button class="mbtn'+(p.isGK?' on':'')+'" data-gk="1"'+(gkFull?' disabled':'')+'>'+
        '<span class="lead"><span class="badge por">POR</span></span>Arquero fijo</button>'+
      [5,4,3,2,1,6,7].map(v=>'<button class="mbtn'+((p.set && !p.isGK && p.arrow===v)?' on':'')+'" data-v="'+v+'">'+
        '<span class="lead">'+levelSvg(v,20)+'</span>'+ARROW_TXT[v]+'</button>').join('')+
    '</div>'+
    '<div class="dots">'+S.players.map((x,j)=>'<span class="dot'+(j===i?' cur':(x.set?' done':''))+'"></span>').join('')+'</div>'+
    '</div>'+
    (gkFull ? '<div class="alert">Tope de <b>'+MAX_GK+'</b> arqueros alcanzado</div>' : '');
  st.querySelectorAll('[data-v]').forEach(b=> b.addEventListener('click',()=>{
    p.isGK=false; p.arrow=+b.dataset.v; p.set=true; nextSlide();
  }));
  st.querySelectorAll('[data-gk]').forEach(b=> b.addEventListener('click',()=>{
    if(gkFull) return; p.isGK=true; p.set=true; nextSlide();
  }));
  setCmd(navBack([cmd('plantel',{off:!S.players.every(x=>x.set)})]));
}
function nextSlide(){
  if(S.slideIdx < S.players.length-1){ S.slideIdx++; render(); }
  else { S.editing=false; S.step='carga'; S.sel=0; render(); }
}

function renderCarga(st){
  const loaded = S.players.filter(x=>x.name.trim()).length;
  const full = loaded === S.players.length;
  const editing = !full || S.editing;
  const p = S.players[S.sel];
  const gkFull = gkTotal() >= MAX_GK && !p.isGK;
  head('PLANTEL', S.cancha.label, loaded+' / '+S.players.length);
  st.className = 'stage';

  const tag = editing ? 'button' : 'div';
  const listHtml =
    '<div class="panel"><div class="phead">JUGADORES</div><div class="list">'+
      S.players.map((x,i)=>'<'+tag+' class="row'+((editing&&i===S.sel)?' sel':'')+(x.name.trim()?'':' empty')+'"'+
        (editing ? ' data-i="'+i+'"' : ' style="cursor:default"')+'>'+
        (x.isGK ? '<span class="badge por">POR</span>' : '')+
        '<span class="nm">'+esc(x.name.trim()||'Sin nombre')+'</span>'+
        (x.isGK?'':levelSvg(x.arrow,15))+'</'+tag+'>').join('')+
    '</div></div>';

  const editHtml =
    '<div class="panel"><div class="phead">'+(p.isGK?'ARQUERO FIJO':'JUGADOR DE CAMPO')+'</div>'+
      '<input type="text" id="nameIn" maxlength="18" placeholder="Nombre" value="'+esc(p.name)+'" autocomplete="off">'+
      '<div class="arrows">'+LEVELS.map(v=>
        '<button data-v="'+v+'" aria-label="'+ARROW_TXT[v]+'" title="'+ARROW_TXT[v]+'"'+
        ((!p.isGK && p.arrow===v)?' class="on"':'')+(p.isGK?' disabled':'')+'>'+levelSvg(v,22)+'</button>').join('')+'</div>'+
      '<div class="sbox" style="margin-top:8px"><h4>NIVEL</h4><p class="sm">'+(p.isGK?'—':ARROW_TXT[p.arrow])+'</p></div>'+
      '<div class="menu"><button class="mbtn" data-togglegk="1"'+(gkFull?' disabled':'')+'>'+
        (p.isGK?'Quitar arquero fijo':'Marcar arquero fijo')+'</button></div>'+
    '</div>';

  const summaryHtml =
    '<div class="panel"><div class="phead">RESUMEN</div>'+
      '<div class="sbox"><h4>MODALIDAD</h4><p class="sm">'+esc(S.cancha.label)+'</p></div>'+
      (S.mode==='liga' ? '<div class="sbox"><h4>EQUIPOS</h4><p>'+S.liga.teams+'</p></div>' : '')+
      '<div class="sbox"><h4>POR EQUIPO</h4><p>'+perTeamText(S.players.length)+'</p></div>'+
      '<div class="sbox"><h4>ARQUEROS FIJOS</h4><p>'+gkTotal()+'</p></div>'+
      '<div class="menu"><button class="mbtn" id="editOn">Editar jugadores</button></div>'+
    '</div>';

  st.innerHTML = listHtml + (editing ? editHtml : summaryHtml);

  if(editing){
    st.querySelectorAll('[data-i]').forEach(b=> b.addEventListener('click',()=>{ commitName(); S.sel=+b.dataset.i; render(); focusName(); }));
    st.querySelectorAll('.arrows button').forEach(b=> b.addEventListener('click',()=>{ commitName(); S.players[S.sel].arrow=+b.dataset.v; render(); focusName(); }));
    st.querySelectorAll('[data-togglegk]').forEach(b=> b.addEventListener('click',()=>{ commitName(); p.isGK=!p.isGK; render(); focusName(); }));
    const inp = $('nameIn');
    inp.addEventListener('input', e=> S.players[S.sel].name = e.target.value);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ commitName(); if(S.sel<S.players.length-1) S.sel++; render(); focusName(); } });
  } else {
    $('editOn').addEventListener('click', ()=>{ S.editing=true; S.sel=0; render(); focusName(); });
  }

  const extra = editing
    ? [cmd('vaciar')].concat(full ? [cmd('editOff')] : [])
    : [];
  setCmd(navBack(extra.concat([cmd('armar',{off:!full})])));
}
function commitName(){ const i=$('nameIn'); if(i) S.players[S.sel].name = i.value; }
function focusName(){ const i=$('nameIn'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }

const KITS = [
  {n:'ROJO',     e:'🔴', c1:'#e04a3f', c2:'#8a1f19'},
  {n:'AZUL',     e:'🔵', c1:'#4f8fe6', c2:'#1d3f7d'},
  {n:'VERDE',    e:'🟢', c1:'#4caf2f', c2:'#1f6a17'},
  {n:'AMARILLO', e:'🟡', c1:'#ffe870', c2:'#c99a08', ink:'#2a2100'},
  {n:'NARANJA',  e:'🟠', c1:'#f5a04a', c2:'#b05d0c'},
  {n:'VIOLETA',  e:'🟣', c1:'#a875f0', c2:'#5a2fa5'},
  {n:'BLANCO',   e:'⚪', c1:'#ffffff', c2:'#c3cbd4', ink:'#101820'},
  {n:'NEGRO',    e:'⚫', c1:'#4a525c', c2:'#0b0f14'}
];
function teamDefs(count){
  if(S.mode!=='liga')
    return [{title:'EQUIPO CLARO', side:'claro', style:'', emoji:'⚪'}, {title:'EQUIPO OSCURO', side:'oscuro', style:'', emoji:'⚫'}];
  return KITS.slice(0,count).map(k=>({title:'EQUIPO '+k.n, side:'kit', emoji:k.e,
    style:'--tc:'+k.c1+';--tc2:'+k.c2+';--ink-c:'+(k.ink||'#fff')}));
}

function teamPanel(title,team,side,style){
  return '<div class="panel"><div class="phead '+side+'" style="'+style+'">'+esc(title)+'</div><div class="list">'+
    team.slice().sort((a,b)=>scoreOf(b)-scoreOf(a)).map(p=>
      '<div class="row'+(p.isGK?' gk':'')+'" style="cursor:default"><span class="badge'+(p.isGK?' por':'')+'">'+p.label+'</span>'+
      '<span class="nm">'+esc(p.name.trim()||'—')+'</span>'+(p.isGK?'':levelSvg(p.arrow,15))+'</div>').join('')+
  '</div></div>';
}
function pitchPanel(title,team,side,style){
  const lines = {POR:[],DEF:[],MED:[],DEL:[]};
  team.forEach(p=> (lines[p.label]||lines.MED).push(p));
  const DOT = {DEL:'d-del', MED:'d-med', DEF:'d-def', POR:'d-por'};
  const line = arr => arr.length
    ? '<div class="pline">'+arr.map(p=>
        '<div class="pl"><i class="dot '+DOT[p.label]+'"></i>'+
        '<span class="plate'+(p.isGK?' gk':'')+'">'+esc(p.name.trim()||'—')+'</span></div>').join('')+'</div>'
    : '';
  return '<div class="panel"><div class="thead '+side+'" style="'+style+'"><span class="sw"></span>'+esc(title)+'</div>'+
    '<div class="pitch '+side+'">'+line(lines.DEL)+line(lines.MED)+line(lines.DEF)+line(lines.POR)+'</div></div>';
}

const ORD = {POR:0, DEF:1, MED:2, DEL:3};
function shareText(){
  const {teams} = teamsCurrent(), defs = teamDefs(teams.length);
  const fmt = t => t.slice()
    .sort((a,b)=> (ORD[a.label]-ORD[b.label]) || a.name.localeCompare(b.name))
    .map(p => p.label + '  ' + (p.name.trim() || '—')).join('\n');
  return '⚽ ' + (S.venue || S.cancha.label) + '\n\n' +
    teams.map((t,i)=> defs[i].emoji + ' ' + defs[i].title + '\n' + fmt(t)).join('\n\n');
}

function renderEquipos(st){
  const {teams,c} = teamsCurrent(), defs = teamDefs(teams.length);
  head('EQUIPOS', S.cancha.label, (S.candIdx+1)+' / '+S.cands.length);
  st.className = 'stage' + (teams.length > 2 ? ' multi' : '');
  const draw = S.view==='cancha' ? pitchPanel : teamPanel;
  const share = S.share
    ? '<div class="panel" style="grid-column:1/-1"><div class="phead">TEXTO PARA WHATSAPP</div>'+
        '<textarea id="shareTxt" readonly style="min-height:190px">'+esc(shareText())+'</textarea>'+
        '<div class="menu" style="margin-top:6px"><button class="mbtn" id="copyBtn">Copiar texto</button></div>'+
        (S.copied ? '<div class="sbox" style="margin-top:6px"><h4>ESTADO</h4><p class="sm">'+esc(S.copied)+'</p></div>' : '')+
      '</div>'
    : '';
  st.innerHTML = teams.map((t,i)=> draw(defs[i].title, t, defs[i].side, defs[i].style)).join('') +
    '<div style="grid-column:1/-1"><div class="sbox"><h4>EQUILIBRIO</h4><p class="sm">'+
      (S.mode==='liga' ? balanceLiga(c.spread) : balanceWord(c.cost))+'</p></div></div>'+
    share;
  if(S.share) $('copyBtn').addEventListener('click', ACTIONS.copyShare);
  setCmd(navBack([
    cmd('vista',{label:S.view==='lista'?'Ver en cancha':'Ver en lista'}),
    cmd('rand',{off:S.cands.length<2}),
    cmd('share',{label:S.share?'Ocultar texto':'Compartir por WhatsApp'})
  ]));
}

// ---------- acciones ----------
const ACTIONS = {
  home(){ S.step='inicio'; S.alert=''; S.raw=''; S.draft=[]; S.players=[]; S.venue=''; render(); },
  formatoOk(){ S.step='importar'; render(); },
  back(){
    S.alert='';
    if(S.step==='slides'){
      if(S.slideIdx>0){ S.slideIdx--; render(); }
      else { S.step='revisar'; render(); }
      return;
    }
    if(S.step==='carga'){
      const full = S.players.every(x=>x.name.trim());
      if(S.editing && full){ commitName(); S.editing=false; render(); return; }
      S.step='slides'; S.slideIdx=S.players.length-1;
      S.editing=false; render(); return;
    }
    S.step = (S.step==='importar' && S.mode==='liga') ? 'formato' : (BACK[S.step] || 'inicio');
    if(S.step==='carga') S.editing=false;
    render();
  },
  startSlides(){
    if(dupInfo(S.draft).dup.size) return;
    const n = S.draft.length, m = matchFor(n);
    if(!m.ok) return;
    const go = () => {
      S.cancha = {label:m.label, n};
      S.players = S.draft.map(nm=>({name:nm, arrow:3, isGK:false, set:false, label:'DEF'}));
      S.slideIdx = 0; S.step='slides'; render();
    };
    if(m.kind==='plus')
      askModal({text:'Son '+n+' en vez de '+m.c.n+' para un F'+m.c.id+', ¿van a jugar '+n+'?', yes:'Sí, jugamos '+n, no:'No, revisar'}, go);
    else go();
  },
  finishSlides(){ S.step='carga'; S.editing=false; S.sel=0; render(); },
  editOff(){ commitName(); S.editing=false; render(); },
  clearAll(){ if(confirm('¿Vaciar todos los nombres?')){
    S.players.forEach(p=>{ p.name=''; p.isGK=false; p.arrow=3; }); S.sel=0; render(); focusName(); } },
  armar(){ commitName(); buildCandidates(); S.share=false; S.copied=''; S.step='equipos'; render(); },
  toggleShare(){ S.share = !S.share; S.copied=''; render(); },
  copyShare(){
    const ta = $('shareTxt');
    if(!ta) return;
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    const done = ok => { S.copied = ok ? 'Copiado' : 'Texto seleccionado: copiá a mano'; render(); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(()=>done(true)).catch(()=>{
        let ok=false; try{ ok = document.execCommand('copy'); }catch(e){}
        done(ok);
      });
    } else {
      let ok=false; try{ ok = document.execCommand('copy'); }catch(e){}
      done(ok);
    }
  },
  toggleView(){ S.view = S.view==='lista'?'cancha':'lista'; render(); },
  reroll(){
    if(S.cands.length<2) return;
    if(S.players.some(p=>!p.isGK && p.arrow===7)){      // con Random se vuelve a sortear el valor
      buildCandidates();
      S.candIdx = Math.floor(Math.random()*Math.min(6, S.cands.length));
    } else {
      let i; do { i = Math.floor(Math.random()*S.cands.length); } while(i===S.candIdx);
      S.candIdx = i;
    }
    S.copied=''; applyLabels(); render();
  }
};

document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && S.step!=='inicio'){ ACTIONS.back(); return; }
  if(S.step==='inicio' && (e.key==='ArrowLeft' || e.key==='ArrowRight')){
    const n = S.slide + (e.key==='ArrowRight' ? 1 : -1);
    if(n>=0 && n<SLIDES.length){ S.slide=n; beep('move'); render(); }
  }
});

$('sndBtn').innerHTML = ic('sndOn',15);
document.getElementById('sndBtn').addEventListener('click', function(){
  S.sound = !S.sound;
  this.innerHTML = ic(S.sound ? 'sndOn' : 'sndOff', 15);
  this.title = S.sound ? 'Sonido activado' : 'Sonido silenciado';
  if(S.sound) beep('move');
});

render();
</script>
